services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vv_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vv_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/vv_db?sslmode=disable
      JWT_SECRET: change-me-in-production
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
